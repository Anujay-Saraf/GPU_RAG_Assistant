[server]
port = 8501
address = "0.0.0.0"
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200
enableWebsocketCompression = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#4A90E2"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1C24"
textColor = "#FAFAFA"
font = "sans serif"